# Foreman as a required check in CI. Copy this file to .github/workflows/foreman-check.yml in your repository,
# then make the "foreman" job a required status check in the branch protection (or ruleset) of your default branch.
#
# Why in CI: inside Hermes the gate runs on the agent's own machine. A required check runs where the agent cannot
# edit it, so a green result here does not depend on the agent.
#
# Exit codes of the detector: 0 = clean, 1 = at least one blocker, 2 = the run could not be done (not a repository,
# git failed, or a SARIF report that cannot be read, whether given with --sarif or named in .foreman.json: CI must
# not pass silently).
#
# Marker-only findings: a finding the author marked with `foreman:allow` is LISTED and exits 0 in CI, and when
# GITHUB_ACTIONS is set (it is) each one is also shown as a `::warning` annotation on the pull request's files. A
# human reviews them in the PR. If your policy is that nobody waves a finding through, add `--strict` below: marked
# findings then count as blockers (exit 1).
#
# The check command (and with it `check-changed`) and the optional SARIF reports come from `.foreman.json` at the
# PR's base, so the pull request cannot redefine them. You can also pass `--check "<command>"` below.
#
# On a pull_request event, actions/checkout checks out the merge of the PR into its base, so
# `origin/<base> .. HEAD` is exactly what the PR changes. The base branch name goes through `env`, never straight
# into the script, so a branch name cannot inject shell.

name: foreman

on:
  pull_request:

permissions:
  contents: read

jobs:
  foreman:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # REQUIRED: replace the placeholder with the full 40-character SHA of the Foreman commit you reviewed (for
      # example from https://github.com/PedValme/foreman/commits/main). Never track a branch in a required check.
      # The step "Check that FOREMAN_SHA is set" fails with a message until you do.
      FOREMAN_SHA: "858e21a4000e216173186081911ea7866565fe3f"
    steps:
      # Pin actions by full commit SHA (this is v4.2.2 / v5.6.0); update them on purpose, after reading the release.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # the detector reads the whole range, history included (a secret removed later still counts)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Check that FOREMAN_SHA is set
        run: |
          if ! printf '%s' "$FOREMAN_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Set FOREMAN_SHA in this workflow to the full 40-character SHA of the Foreman commit you reviewed (it is still '$FOREMAN_SHA')."
            exit 1
          fi

      - name: Download Foreman at a pinned commit
        run: |
          curl -fsSL "https://github.com/PedValme/foreman/archive/${FOREMAN_SHA}.tar.gz" -o "$RUNNER_TEMP/foreman.tar.gz"
          mkdir "$RUNNER_TEMP/foreman"
          tar -xzf "$RUNNER_TEMP/foreman.tar.gz" -C "$RUNNER_TEMP/foreman" --strip-components=1

      # Optional: run your scanner in an earlier step and write a SARIF report (for example results.sarif), then add
      # `--sarif results.sarif` below, or list it under "sarif" in .foreman.json. Foreman never runs a scanner itself;
      # it only reads the file. By default only results in files the pull request touches (or new ones) block; use
      # `--sarif-scope all` to let old findings block too.

      - name: Foreman
        env:
          BASE: ${{ github.base_ref }}
          # The download's plugin/ folder holds the foreman package. A Foreman commit from before plugin/ existed has
          # it at the root: use ${{ runner.temp }}/foreman for that one.
          PYTHONPATH: ${{ runner.temp }}/foreman/plugin
        run: python -m foreman.detector "origin/$BASE" HEAD
        # Variants:
        #   python -m foreman.detector "origin/$BASE" HEAD --strict
        #   python -m foreman.detector "origin/$BASE" HEAD --sarif results.sarif --sarif-threshold error
